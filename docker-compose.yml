# docker-compose.yml -- Phase 0 local stack.
#
# postgres : supabase/postgres, pinned as requested (PostGIS + friends
#            already baked in).
# martin   : vector tile server, points straight at postgres. No feature
#            classes exist yet (Phase 1), so it has nothing to serve until
#            then -- it's here so the wiring exists from day one.
# rustfs   : S3-compatible object storage for attachments (RustFS-backed),
#            unused until Phase 2.
# api      : Go/chi/bun skeleton, proves it can reach postgres via /healthz.
# gitbash  : Alpine shell with git + bash + psql, mounted against the repo
#            root. Stands in for Git Bash and runs migrations/apply.sh.
#
# Martin's and RustFS's tags are pinned to `latest` deliberately -- pin
# them to an exact version once you've confirmed the pull and it works,
# rather than trusting a version number nobody has run.
#
# Published ports are all in 3700-3720, deliberately not the defaults
# (5432, 3000, 9000/9001, 8080) -- see .env.example for the assignment.
#
# DATABASE_URLs carry ?sslmode=disable -- this postgres image has no TLS
# configured (no certs mounted), and pgdriver's client default is to
# attempt TLS regardless, so without this every connection fails with
# "SSL is not enabled on the server". Local-dev-only: a real deployment
# with TLS available should drop this, not carry it forward.

services:
  postgres:
    image: supabase/postgres:15.8.1.049
    container_name: voltedge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voltedge_dev}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_PORT:-3700}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  martin:
    image: ghcr.io/maplibre/martin:latest
    container_name: voltedge-martin
    restart: unless-stopped
    # --config: publish tile *functions*, not raw tables. Martin's default is
    # to auto-publish every geometry table directly, but a raw table source has
    # no WHERE clause and so served soft-deleted rows (deleted_at set) to the
    # map. infra/martin/config.yaml turns table auto-publish off and publishes
    # the per-class gis.<code>(z,x,y) tile functions instead (migration 0038 +
    # api/internal/compiler), which filter deleted_at IS NULL. The config reads
    # DATABASE_URL by env substitution, so that env var below still drives it.
    #
    # --cache-size 0: Martin's tile cache keys on (source, z, x, y) only,
    # not on the data underneath -- a tile fetched once (even an empty
    # one, before a feature existed there) is served stale forever,
    # surviving even a hard client-side refresh. Martin has no per-tile
    # invalidation to reach for instead (only this on/off size knob) --
    # see docs/phase-3-create-feature.md's "How this was validated" for
    # how this was diagnosed. Since VoltEdge is an active editing tool,
    # not a high-traffic public tile server, "a feature is visible on
    # the map right after it's saved" wins over the caching every
    # uncached tile request now costs a live Postgres query. Revisit if
    # that tradeoff stops being true (e.g. a large territory with rare
    # edits and real tile-serving load).
    command: ["--config", "/config/config.yaml", "--cache-size", "0"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-voltedge_dev}@postgres:5432/${POSTGRES_DB:-postgres}?sslmode=disable
    ports:
      - "${MARTIN_PORT:-3701}:3000"
    volumes:
      - ./infra/martin/config.yaml:/config/config.yaml:ro

  rustfs:
    image: rustfs/rustfs:latest
    container_name: voltedge-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-voltedge}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-voltedge_dev_secret}
      # CORS for browser-direct attachment uploads (Phase 22). The web app PUTs
      # attachment bytes straight to RustFS via a presigned URL; that fetch is
      # preflighted, and RustFS answers the OPTIONS only for origins listed here.
      # Unlike AWS S3/MinIO, RustFS has no per-bucket PutBucketCors subresource
      # (rustfs/rustfs#1386) -- CORS is a server-level env, applied here. The
      # presigned PUT carries no cookies/credentials, so wildcard "*" is safe for
      # dev; set RUSTFS_CORS_ORIGINS to the web app origin(s) in production.
      # NOTE: needs RustFS >= 1.0.0-beta.2, where unset means "no CORS headers"
      # (older builds reflected any origin -- GHSA-x5xv-223c-8vm7).
      RUSTFS_CORS_ALLOWED_ORIGINS: ${RUSTFS_CORS_ORIGINS:-*}
    ports:
      - "${RUSTFS_S3_PORT:-3702}:9000"
      - "${RUSTFS_CONSOLE_PORT:-3703}:9001"
    volumes:
      - rustfs_data:/data

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: voltedge-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-voltedge_dev}@postgres:5432/${POSTGRES_DB:-postgres}?sslmode=disable
      PORT: "8080"
      # Export storage (Phase 17). Inside the compose network RustFS is reached
      # as rustfs:9000 for uploads. Download presigned URLs, though, are signed
      # for RUSTFS_PUBLIC_ENDPOINT -- the host the *browser* reaches RustFS at
      # (the published S3 port, localhost:3702 by default), since a browser can't
      # resolve rustfs:9000. This is the internal/public endpoint split; override
      # RUSTFS_PUBLIC_ENDPOINT with a LAN/public host for non-localhost clients.
      RUSTFS_ENDPOINT: rustfs:9000
      RUSTFS_PUBLIC_ENDPOINT: ${RUSTFS_PUBLIC_ENDPOINT:-localhost:3702}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-voltedge-exports}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-voltedge}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-voltedge_dev_secret}
    ports:
      - "${API_PORT:-3704}:8080"

  # The export worker (Phase 17). Same image as api, different command: it
  # drains the ops.export_jobs queue and streams artifacts into RustFS. Scale
  # it with `docker compose up -d --scale exportworker=N` -- SKIP LOCKED hands
  # each replica distinct jobs. Uploads only, so the internal rustfs:9000
  # endpoint is complete for it (no browser presign concern).
  exportworker:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: voltedge-exportworker
    restart: unless-stopped
    command: ["exportworker"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-voltedge_dev}@postgres:5432/${POSTGRES_DB:-postgres}?sslmode=disable
      RUSTFS_ENDPOINT: rustfs:9000
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-voltedge-exports}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-voltedge}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-voltedge_dev_secret}
      EXPORT_WORKER_CONCURRENCY: ${EXPORT_WORKER_CONCURRENCY:-2}
      EXPORT_JOB_LEASE: ${EXPORT_JOB_LEASE:-60s}

  # The MCP server (Phase 18). Same image as api, different command: it serves
  # the read-only data-plane tools an AI agent calls over POST /mcp, each
  # authenticated by an iam.api_tokens bearer token (mint one out-of-band with
  # `authadmin mint-token`). It only reads via the shared engine, so it needs
  # DATABASE_URL and nothing else -- no RustFS, no export config.
  mcpserver:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: voltedge-mcpserver
    restart: unless-stopped
    command: ["mcpserver"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-voltedge_dev}@postgres:5432/${POSTGRES_DB:-postgres}?sslmode=disable
      MCP_PORT: "8090"
    ports:
      - "${MCP_PORT:-3705}:8090"

  # The field-tool engine (Phase 21). Its OWN image (api/Dockerfile.fieldsync),
  # not the shared api image: it bundles tippecanoe (built from Felt source in
  # that Dockerfile) to compile each pack's MBTiles, which the other binaries
  # have no need for. One process runs both the pack-build worker (drains
  # ops.field_packs, SKIP LOCKED) and the device-facing HTTP surface on
  # FIELDSYNC_PORT (8091), all under iam.api_tokens bearer auth. Scale the build
  # throughput with `docker compose up -d --scale fieldsync=N`.
  #
  # Uploads go to rustfs:9000 (internal); pack download URLs are presigned for
  # RUSTFS_PUBLIC_ENDPOINT (the same internal/public split as the api service).
  # For a real field device, override RUSTFS_PUBLIC_ENDPOINT with the host's
  # LAN/public address (e.g. 192.168.1.x:3702) so the device can resolve it --
  # localhost:3702 only works for a browser on this machine.
  fieldsync:
    build:
      context: ./api
      dockerfile: Dockerfile.fieldsync
    container_name: voltedge-fieldsync
    restart: unless-stopped
    command: ["fieldsync"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-voltedge_dev}@postgres:5432/${POSTGRES_DB:-postgres}?sslmode=disable
      FIELDSYNC_PORT: "8091"
      RUSTFS_ENDPOINT: rustfs:9000
      RUSTFS_PUBLIC_ENDPOINT: ${RUSTFS_PUBLIC_ENDPOINT:-localhost:3702}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-voltedge-exports}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-voltedge}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-voltedge_dev_secret}
      FIELDSYNC_WORKER_CONCURRENCY: ${FIELDSYNC_WORKER_CONCURRENCY:-2}
      FIELDSYNC_JOB_LEASE: ${FIELDSYNC_JOB_LEASE:-60s}
      # The sync-apply worker (Phase 23) runs as a second goroutine in this same
      # process, draining ops.sync_inbox to production. Its own concurrency/lease
      # knobs, sibling to the pack-build worker's above.
      SYNC_WORKER_CONCURRENCY: ${SYNC_WORKER_CONCURRENCY:-2}
      SYNC_JOB_LEASE: ${SYNC_JOB_LEASE:-60s}
    ports:
      - "${FIELDSYNC_PORT:-3706}:8091"

  gitbash:
    build:
      context: ./infra/gitbash
      dockerfile: Dockerfile
    container_name: voltedge-gitbash
    stdin_open: true
    tty: true
    depends_on:
      - postgres
    volumes:
      - .:/workspace
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-voltedge_dev}@postgres:5432/${POSTGRES_DB:-postgres}?sslmode=disable

volumes:
  postgres_data:
  rustfs_data:
