# docker-compose.yml -- Phase 0 local stack.
#
# postgres : supabase/postgres, pinned as requested (PostGIS + friends
#            already baked in).
# martin   : vector tile server, points straight at postgres. No feature
#            classes exist yet (Phase 1), so it has nothing to serve until
#            then -- it's here so the wiring exists from day one.
# rustfs   : S3-compatible object storage for attachments (RustFS-backed),
#            unused until Phase 2.
# api      : Go/chi/bun skeleton, proves it can reach postgres via /healthz.
# gitbash  : Alpine shell with git + bash + psql, mounted against the repo
#            root. Stands in for Git Bash and runs migrations/apply.sh.
#
# Martin's and RustFS's tags are pinned to `latest` deliberately -- pin
# them to an exact version once you've confirmed the pull and it works,
# rather than trusting a version number nobody has run.
#
# Published ports are all in 3700-3720, deliberately not the defaults
# (5432, 3000, 9000/9001, 8080) -- see .env.example for the assignment.
#
# DATABASE_URLs carry ?sslmode=disable -- this postgres image has no TLS
# configured (no certs mounted), and pgdriver's client default is to
# attempt TLS regardless, so without this every connection fails with
# "SSL is not enabled on the server". Local-dev-only: a real deployment
# with TLS available should drop this, not carry it forward.

services:
  postgres:
    image: supabase/postgres:15.8.1.049
    container_name: voltedge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voltedge_dev}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_PORT:-3700}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  martin:
    image: ghcr.io/maplibre/martin:latest
    container_name: voltedge-martin
    restart: unless-stopped
    # --cache-size 0: Martin's tile cache keys on (source, z, x, y) only,
    # not on the data underneath -- a tile fetched once (even an empty
    # one, before a feature existed there) is served stale forever,
    # surviving even a hard client-side refresh. Martin has no per-tile
    # invalidation to reach for instead (only this on/off size knob) --
    # see docs/phase-3-create-feature.md's "How this was validated" for
    # how this was diagnosed. Since VoltEdge is an active editing tool,
    # not a high-traffic public tile server, "a feature is visible on
    # the map right after it's saved" wins over the caching every
    # uncached tile request now costs a live Postgres query. Revisit if
    # that tradeoff stops being true (e.g. a large territory with rare
    # edits and real tile-serving load).
    command: ["--cache-size", "0"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-voltedge_dev}@postgres:5432/${POSTGRES_DB:-postgres}?sslmode=disable
    ports:
      - "${MARTIN_PORT:-3701}:3000"

  rustfs:
    image: rustfs/rustfs:latest
    container_name: voltedge-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-voltedge}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-voltedge_dev_secret}
    ports:
      - "${RUSTFS_S3_PORT:-3702}:9000"
      - "${RUSTFS_CONSOLE_PORT:-3703}:9001"
    volumes:
      - rustfs_data:/data

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: voltedge-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-voltedge_dev}@postgres:5432/${POSTGRES_DB:-postgres}?sslmode=disable
      PORT: "8080"
      # Export storage (Phase 17). Inside the compose network RustFS is reached
      # as rustfs:9000, so that is the endpoint here -- NOT the .env value
      # (localhost:3702), which is for host-run dev + the browser. Caveat: the
      # download presigned URL is signed for this same endpoint, so a browser
      # (which can't resolve rustfs:9000) can't follow it from the in-compose
      # API. Splitting the internal upload endpoint from the public presign
      # endpoint is a documented follow-up; host-run `task api-dev` is the
      # browser-facing dev path today.
      RUSTFS_ENDPOINT: rustfs:9000
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-voltedge-exports}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-voltedge}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-voltedge_dev_secret}
    ports:
      - "${API_PORT:-3704}:8080"

  # The export worker (Phase 17). Same image as api, different command: it
  # drains the ops.export_jobs queue and streams artifacts into RustFS. Scale
  # it with `docker compose up -d --scale exportworker=N` -- SKIP LOCKED hands
  # each replica distinct jobs. Uploads only, so the internal rustfs:9000
  # endpoint is complete for it (no browser presign concern).
  exportworker:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: voltedge-exportworker
    restart: unless-stopped
    command: ["exportworker"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-voltedge_dev}@postgres:5432/${POSTGRES_DB:-postgres}?sslmode=disable
      RUSTFS_ENDPOINT: rustfs:9000
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-voltedge-exports}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-voltedge}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-voltedge_dev_secret}
      EXPORT_WORKER_CONCURRENCY: ${EXPORT_WORKER_CONCURRENCY:-2}
      EXPORT_JOB_LEASE: ${EXPORT_JOB_LEASE:-60s}

  # The MCP server (Phase 18). Same image as api, different command: it serves
  # the read-only data-plane tools an AI agent calls over POST /mcp, each
  # authenticated by an iam.api_tokens bearer token (mint one out-of-band with
  # `authadmin mint-token`). It only reads via the shared engine, so it needs
  # DATABASE_URL and nothing else -- no RustFS, no export config.
  mcpserver:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: voltedge-mcpserver
    restart: unless-stopped
    command: ["mcpserver"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-voltedge_dev}@postgres:5432/${POSTGRES_DB:-postgres}?sslmode=disable
      MCP_PORT: "8090"
    ports:
      - "${MCP_PORT:-3705}:8090"

  gitbash:
    build:
      context: ./infra/gitbash
      dockerfile: Dockerfile
    container_name: voltedge-gitbash
    stdin_open: true
    tty: true
    depends_on:
      - postgres
    volumes:
      - .:/workspace
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-voltedge_dev}@postgres:5432/${POSTGRES_DB:-postgres}?sslmode=disable

volumes:
  postgres_data:
  rustfs_data:
