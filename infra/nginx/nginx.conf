# infra/nginx/nginx.conf -- front-door for docker-compose.prod.yml.
#
# It does TWO jobs:
#   1. Serves the built React SPA (web/dist) as static files.
#   2. Reverse-proxies the backend API, load-balancing across every `api`
#      replica.
#
# Routing mirrors the frontend's dev proxy (web/vite.config.ts) EXACTLY, which
# is the contract the SPA is built against:
#   * the SPA calls /api/*  -> strip the /api prefix, proxy to the API root
#     (web/src/lib/api.ts: API_BASE = "/api"; dev rewrites ^/api -> "").
#   * the SPA calls /tiles/* -> proxy KEEPING the prefix (the API mounts its
#     territory-scoped MVT tile router at /tiles; dev proxies with no rewrite).
#   * everything else -> the SPA (history-API fallback to index.html).
#
# The load-balancing trick: proxy_pass a VARIABLE + a resolver, so nginx
# re-resolves `api` through Docker's embedded DNS on a short TTL and picks up
# replicas added/removed by `--scale api=N` without a reload. A literal
# `proxy_pass http://api:8080` resolves once at startup and never sees new
# replicas. (With a variable proxy_pass, nginx passes the post-rewrite URI, so
# the /api strip below is done with an explicit `rewrite`.)

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Edge rate-limit for login. The app's own limiter is PER-REPLICA and no
    # longer global once you scale out, so the real brake lives here.
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;

    client_max_body_size 32m;              # match the API's body cap
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;             # analysis/trace calls can take a second or two
    proxy_send_timeout    60s;

    log_format main '$remote_addr - $status "$request" '
                    'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    # gzip the SPA + JSON API responses.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;        # the mounted web/dist bundle

        # --- Backend: the login route, throttled hard at the edge ------------
        location = /api/auth/login {
            limit_req zone=login burst=10 nodelay;
            rewrite ^/api/(.*)$ /$1 break;        # strip the /api prefix
            set $api http://api:8080;
            proxy_pass $api;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_http_version 1.1;
        }

        # --- Backend: everything else under /api (strip the prefix) ----------
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            set $api http://api:8080;
            proxy_pass $api;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_http_version 1.1;
        }

        # --- Backend: map tiles (KEEP the /tiles prefix) ---------------------
        location /tiles/ {
            set $api http://api:8080;
            proxy_pass $api;                      # variable form preserves the full URI
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_http_version 1.1;
        }

        # --- Static: hashed build assets, cached hard ------------------------
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # --- The SPA: history-API fallback to index.html ---------------------
        location / {
            try_files $uri /index.html;
        }
    }
}
