# infra/grafana/provisioning/datasources/loki.yaml -- auto-wires the Loki data
# source into Grafana at startup, so the stack comes up ready to query with no
# click-through setup. Grafana reaches Loki over the compose network as loki:3100.
apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: true
