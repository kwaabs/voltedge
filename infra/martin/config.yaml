# Martin tile server configuration (mounted read-only into the container by
# docker-compose.yml). Exists for one reason: to publish tile *functions*
# instead of raw tables.
#
# Martin's default is to auto-publish every geometry table in the database as a
# tile source. A raw table source has no WHERE clause, so it served soft-deleted
# feature rows (deleted_at set) straight to the map -- see migration 0038. With
# auto_publish.tables:false, Martin publishes no tables at all; each compiled
# feature class instead exposes a gis.<code>(z,x,y) tile function (generated by
# migration 0038's gis.sync_tile_function, refreshed by api/internal/compiler on
# every compile) that filters deleted_at IS NULL.
#
# connection_string uses env-var substitution -- docker-compose still passes
# DATABASE_URL to the martin service, exactly as before the config file existed.
postgres:
  connection_string: ${DATABASE_URL}
  auto_publish:
    # Do NOT publish tables: they carry soft-deleted rows. See above.
    tables: false
    functions:
      from_schemas:
        - gis
      # Bare function name as the source id -- byte-for-byte the source ids the
      # frontend already keys on (a lowercased feature-class code, e.g. `pole`),
      # since each tile function is named exactly like the table it replaces.
      # Nothing downstream (the catalog, the per-class VectorTileLayers) changes.
      source_id_format: '{function}'
