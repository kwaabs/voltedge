version: "3"

dotenv:
  - ".env"

vars:
  API_DIR: api
  POSTGRES_PASSWORD: '{{.POSTGRES_PASSWORD | default "voltedge_dev"}}'
  POSTGRES_DB: '{{.POSTGRES_DB | default "postgres"}}'
  POSTGRES_PORT: '{{.POSTGRES_PORT | default "3700"}}'
  API_PORT: '{{.API_PORT | default "3704"}}'
  MCP_PORT: '{{.MCP_PORT | default "3705"}}'
  FIELDSYNC_PORT: '{{.FIELDSYNC_PORT | default "3706"}}'
  RUSTFS_S3_PORT: '{{.RUSTFS_S3_PORT | default "3702"}}'

  LOCAL_DATABASE_URL: "postgres://postgres:{{.POSTGRES_PASSWORD}}@localhost:{{.POSTGRES_PORT}}/{{.POSTGRES_DB}}?sslmode=disable"
  CONTAINER_DATABASE_URL: "postgres://postgres:{{.POSTGRES_PASSWORD}}@postgres:5432/{{.POSTGRES_DB}}?sslmode=disable"

tasks:
  # ---------------------------------------------------------------- infra --

  infra-up:
    desc: Start postgres, martin, rustfs, gitbash
    cmds:
      - docker compose up -d postgres martin rustfs gitbash

  infra-down:
    desc: Stop all containers, keep volumes
    cmds:
      - docker compose down

  infra-clean:
    desc: Stop all containers AND delete volumes -- wipes the local DB
    interactive: true
    cmds:
      - powershell -NoProfile -Command "$answer = Read-Host 'This deletes postgres_data and rustfs_data volumes. Type YES to continue'; if ($answer -ne 'YES') { Write-Host 'Aborted.'; exit 1 }"
      - docker compose down -v

  infra-ps:
    desc: Show status of the compose stack
    cmds:
      - docker compose ps

  infra-logs:
    desc: Tail logs for every service
    cmds:
      - docker compose logs -f

  up:
    desc: Start everything, including the api container, building images as needed
    cmds:
      - docker compose up -d --build

  down:
    desc: Stop all containers, keep volumes
    cmds:
      - task: infra-down

  # ------------------------------------------------------------------ api --

  api-dev:
    desc: Run the API locally against the dockerized postgres
    dir: "{{.API_DIR}}"
    env:
      DATABASE_URL: "{{.LOCAL_DATABASE_URL}}"
      PORT: "{{.API_PORT}}"
    cmds:
      - go run ./cmd/server

  api-build:
    desc: Build the API binary to api/bin/server
    dir: "{{.API_DIR}}"
    cmds:
      - go build -o bin/server ./cmd/server

  exportworker-dev:
    desc: Run the export worker locally against dockerized postgres + rustfs (Phase 17)
    dir: "{{.API_DIR}}"
    env:
      DATABASE_URL: "{{.LOCAL_DATABASE_URL}}"
    cmds:
      - go run ./cmd/exportworker

  mcp-dev:
    desc: Run the MCP server locally against dockerized postgres (Phase 18)
    dir: "{{.API_DIR}}"
    env:
      DATABASE_URL: "{{.LOCAL_DATABASE_URL}}"
      MCP_PORT: "{{.MCP_PORT}}"
    cmds:
      - go run ./cmd/mcpserver

  fieldsync-dev:
    desc: Run the field-tool engine locally against dockerized postgres + rustfs (Phase 21)
    # RUSTFS_* come from .env (dotenv), same as exportworker-dev. tippecanoe must
    # be on PATH (or set TIPPECANOE_BIN) -- the compose image bundles it, but a
    # host run uses your local install.
    dir: "{{.API_DIR}}"
    env:
      DATABASE_URL: "{{.LOCAL_DATABASE_URL}}"
      FIELDSYNC_PORT: "{{.FIELDSYNC_PORT}}"
    cmds:
      - go run ./cmd/fieldsync

  adb-reverse:
    desc: "Tunnel a USB-connected Android device to the host's field-tool ports (Phase 21). Run after each reconnect; needs adb on PATH + one device attached."
    # A physical device (not the emulator) reaches host services over
    # `adb reverse`, so the app's baseUrl is http://localhost:<port> -- NOT
    # 10.0.2.2, which is emulator-only. Three ports:
    #   FIELDSYNC_PORT (3706) -- the pack list/create/download HTTP API
    #   RUSTFS_S3_PORT (3702) -- RustFS, where pack artifacts are presigned
    #                            (RUSTFS_PUBLIC_ENDPOINT=localhost:3702), so
    #                            without it the device gets a manifest but
    #                            can't fetch the .mbtiles/.sqlite
    #   API_PORT       (3704) -- the main cookie-session web API surface
    cmds:
      - adb reverse tcp:{{.FIELDSYNC_PORT}} tcp:{{.FIELDSYNC_PORT}}
      - adb reverse tcp:{{.RUSTFS_S3_PORT}} tcp:{{.RUSTFS_S3_PORT}}
      - adb reverse tcp:{{.API_PORT}} tcp:{{.API_PORT}}
      - adb reverse --list

  api-test:
    desc: Run API tests
    dir: "{{.API_DIR}}"
    cmds:
      - go test ./...

  tidy:
    desc: Run go mod tidy on the API module
    dir: "{{.API_DIR}}"
    cmds:
      - go mod tidy

  vet:
    desc: Run go vet on the API module
    dir: "{{.API_DIR}}"
    cmds:
      - go vet ./...

  fmt:
    desc: Run gofmt on the API module
    dir: "{{.API_DIR}}"
    cmds:
      - gofmt -l -w .

  compile:
    desc: Compile one feature class metadata into physical schema
    dir: "{{.API_DIR}}"
    requires:
      vars:
        - name: CODE
          desc: Feature class code, e.g. POLE
    env:
      DATABASE_URL: "{{.LOCAL_DATABASE_URL}}"
    cmds:
      - go run ./cmd/compile {{.CODE}}

  uncompile:
    desc: "Drop one feature class's physical table + tile function and reset it to draft (DESTRUCTIVE: discards all its rows). Follow with `task compile CODE=...` to rebuild fresh -- used to add a required field to a class that already has data."
    dir: "{{.API_DIR}}"
    requires:
      vars:
        - name: CODE
          desc: Feature class code, e.g. MV_FUSE
    env:
      DATABASE_URL: "{{.LOCAL_DATABASE_URL}}"
    cmds:
      - go run ./cmd/uncompile {{.CODE}}

  authadmin-create:
    desc: "Bootstrap/create a break-glass admin (Phase 10). EMAIL + NAME vars; set AUTHADMIN_PASSWORD in your env/.env first"
    dir: "{{.API_DIR}}"
    requires:
      vars:
        - name: EMAIL
          desc: Account email, e.g. admin@yourutility.com
        - name: NAME
          desc: Display name, e.g. "Break-glass Admin"
    env:
      DATABASE_URL: "{{.LOCAL_DATABASE_URL}}"
    cmds:
      - go run ./cmd/authadmin create --email {{.EMAIL}} --name "{{.NAME}}"

  authadmin-set-password:
    desc: "Reset a lost local/break-glass password (Phase 10). EMAIL var; set AUTHADMIN_PASSWORD in your env/.env first"
    dir: "{{.API_DIR}}"
    requires:
      vars:
        - name: EMAIL
          desc: Account email
    env:
      DATABASE_URL: "{{.LOCAL_DATABASE_URL}}"
    cmds:
      - go run ./cmd/authadmin set-password --email {{.EMAIL}}

  authadmin-list:
    desc: List all accounts and their roles (Phase 10)
    dir: "{{.API_DIR}}"
    env:
      DATABASE_URL: "{{.LOCAL_DATABASE_URL}}"
    cmds:
      - go run ./cmd/authadmin list

  authadmin-roles:
    desc: List the available RBAC roles (Phase 10 Slice C)
    dir: "{{.API_DIR}}"
    env:
      DATABASE_URL: "{{.LOCAL_DATABASE_URL}}"
    cmds:
      - go run ./cmd/authadmin roles

  authadmin-grant-role:
    desc: "Grant a role to an account (Phase 10 Slice C). EMAIL + ROLE vars"
    dir: "{{.API_DIR}}"
    requires:
      vars:
        - name: EMAIL
          desc: Account email
        - name: ROLE
          desc: "Role key, e.g. editor (see `task authadmin-roles`)"
    env:
      DATABASE_URL: "{{.LOCAL_DATABASE_URL}}"
    cmds:
      - go run ./cmd/authadmin grant-role --email {{.EMAIL}} --role {{.ROLE}}

  authadmin-revoke-role:
    desc: "Revoke a role from an account (Phase 10 Slice C). EMAIL + ROLE vars"
    dir: "{{.API_DIR}}"
    requires:
      vars:
        - name: EMAIL
          desc: Account email
        - name: ROLE
          desc: Role key to revoke
    env:
      DATABASE_URL: "{{.LOCAL_DATABASE_URL}}"
    cmds:
      - go run ./cmd/authadmin revoke-role --email {{.EMAIL}} --role {{.ROLE}}

  authadmin-mint-token:
    desc: "Mint an MCP API token, printed once (Phase 18). EMAIL + NAME vars; optional TTL (e.g. 720h)"
    dir: "{{.API_DIR}}"
    requires:
      vars:
        - name: EMAIL
          desc: Owning account email
        - name: NAME
          desc: Token label, e.g. claude-desktop
    env:
      DATABASE_URL: "{{.LOCAL_DATABASE_URL}}"
    cmds:
      - go run ./cmd/authadmin mint-token --email {{.EMAIL}} --name "{{.NAME}}" {{if .TTL}}--ttl {{.TTL}}{{end}}

  authadmin-list-tokens:
    desc: "List a user's MCP API tokens (Phase 18). EMAIL var"
    dir: "{{.API_DIR}}"
    requires:
      vars:
        - name: EMAIL
          desc: Owning account email
    env:
      DATABASE_URL: "{{.LOCAL_DATABASE_URL}}"
    cmds:
      - go run ./cmd/authadmin list-tokens --email {{.EMAIL}}

  authadmin-revoke-token:
    desc: "Revoke one MCP API token (Phase 18). EMAIL + ID vars (see `task authadmin-list-tokens`)"
    dir: "{{.API_DIR}}"
    requires:
      vars:
        - name: EMAIL
          desc: Owning account email
        - name: ID
          desc: Token id to revoke
    env:
      DATABASE_URL: "{{.LOCAL_DATABASE_URL}}"
    cmds:
      - go run ./cmd/authadmin revoke-token --email {{.EMAIL}} --id {{.ID}}

  seed-pole:
    desc: Load the POLE example metadata through the gitbash sidecar
    cmds:
      - >-
        docker compose exec -T gitbash
        psql "{{.CONTAINER_DATABASE_URL}}"
        -f /workspace/seed/pole_example.sql

  seed-tower:
    desc: Load the TOWER example metadata through the gitbash sidecar -- a transmission support structure, leaner sibling of POLE (TOWER_MATERIAL steel-lattice/tubular/concrete, lattice/tubular/guyed/monopole subtypes, material+height_class+install_date+condition+last_inspected fields, no pole_use; compile CODE=TOWER after)
    cmds:
      - >-
        docker compose exec -T gitbash
        psql "{{.CONTAINER_DATABASE_URL}}"
        -f /workspace/seed/tower_example.sql

  seed-tower-relationship:
    desc: Load the TOWER supports MV_CONDUCTOR relationship class through the gitbash sidecar -- enables a tower to carry a double circuit (two conductor runs sharing one structure; Phase 35). Requires seed-tower + seed-connectivity first; no compile needed
    cmds:
      - >-
        docker compose exec -T gitbash
        psql "{{.CONTAINER_DATABASE_URL}}"
        -f /workspace/seed/tower_relationship_example.sql

  seed-connectivity:
    desc: Load the MV_CONDUCTOR/DIST_XFMR connectivity example metadata through the gitbash sidecar
    cmds:
      - >-
        docker compose exec -T gitbash
        psql "{{.CONTAINER_DATABASE_URL}}"
        -f /workspace/seed/connectivity_example.sql

  seed-relationships:
    desc: Load the POLE/MV_CONDUCTOR relationship_classes example metadata through the gitbash sidecar (requires seed-pole and seed-connectivity first)
    cmds:
      - >-
        docker compose exec -T gitbash
        psql "{{.CONTAINER_DATABASE_URL}}"
        -f /workspace/seed/relationship_example.sql

  seed-substation-yard:
    desc: Load the SUBSTATION (polygon site boundary; renamed from SUBSTATION_YARD in Phase 47 Slice 2, file keeps its historic name) example metadata through the gitbash sidecar -- compile CODE=SUBSTATION after; on a DB with existing yard rows apply migration 0085 first for the data-preserving table rename
    cmds:
      - >-
        docker compose exec -T gitbash
        psql "{{.CONTAINER_DATABASE_URL}}"
        -f /workspace/seed/substation_yard_example.sql

  seed-structure:
    desc: Load the STRUCTURE (generic building/premises polygon) example metadata through the gitbash sidecar -- STRUCTURE_USE domain, permanent/temporary subtypes, use_type/storeys/has_basement fields, STRUCTURE-contains-SERVICE_POINT/METER containment (requires the metering seeds; compile CODE=STRUCTURE after)
    cmds:
      - >-
        docker compose exec -T gitbash
        psql "{{.CONTAINER_DATABASE_URL}}"
        -f /workspace/seed/structure_example.sql

  seed-bay:
    desc: Load the BAY (substation bay / control-building panel) example metadata through the gitbash sidecar (Phase 34 Slice 1; compile CODE=BAY after, then apply seed-bay-containment for the yard->bay->plant wiring)
    cmds:
      - >-
        docker compose exec -T gitbash
        psql "{{.CONTAINER_DATABASE_URL}}"
        -f /workspace/seed/bay_example.sql

  seed-bay-containment:
    desc: Wire BAY containment through the gitbash sidecar (Phase 34 Slice 2; yard->bay->plant relationship_classes, retires the flat yard->plant rows; run after seed-bay + the MV plant seeds)
    cmds:
      - >-
        docker compose exec -T gitbash
        psql "{{.CONTAINER_DATABASE_URL}}"
        -f /workspace/seed/bay_containment_example.sql

  seed-substation-panel:
    desc: Load the SUBSTATION_PANEL (control-building panel as a first-class inventoried asset -- protection/control/metering/RTU-SCADA/auxiliary/marshalling via panel_type; the physical enclosure, orthogonal to the logical BAY circuit) example metadata through the gitbash sidecar (Phase 45 Slice 1; geometry_type none like BAY; compile CODE=SUBSTATION_PANEL after, then apply seed-substation-panel-containment for the yard->panel->relay/meter + panel<->bay wiring)
    cmds:
      - >-
        docker compose exec -T gitbash
        psql "{{.CONTAINER_DATABASE_URL}}"
        -f /workspace/seed/substation_panel_example.sql

  seed-substation-panel-containment:
    desc: Wire SUBSTATION_PANEL containment + the panel<->bay mapping through the gitbash sidecar (Phase 45 Slice 1; SUBSTATION_YARD contains SUBSTATION_PANEL + SUBSTATION_PANEL contains PROTECTIVE_RELAY/METER as physical enclosure, plus the many_to_many SUBSTATION_PANEL serves BAY association [kind panel_bay] that decouples panel from circuit; requires migration 0083 for the panel_bay kind + run after seed-substation-panel + seed-bay + protective-relay/metering seeds)
    cmds:
      - >-
        docker compose exec -T gitbash
        psql "{{.CONTAINER_DATABASE_URL}}"
        -f /workspace/seed/substation_panel_containment_example.sql

  seed-substation-panel-symbology:
    desc: Load map + diagram symbology for SUBSTATION_PANEL through the gitbash sidecar (Phase 45 Slice 2 "just depiction"; flips is_diagram_placeable=true + adds the 'panel' cabinet glyph + a map default [publish gate] + per-panel_type diagram overrides keyed on panel_type; requires seed-substation-panel first; no compile -- symbology + placeable flag are read client-side/live)
    cmds:
      - >-
        docker compose exec -T gitbash
        psql "{{.CONTAINER_DATABASE_URL}}"
        -f /workspace/seed/substation_panel_symbology.sql

  seed-control-building:
    desc: Load the CONTROL_BUILDING (optional control room/building of a substation -- polygon with optional geometry, holds SUBSTATION_PANEL as its physical home; num_floors/construction_type/floor_area attributes) example metadata through the gitbash sidecar (Phase 47 Slice 1; compile CODE=CONTROL_BUILDING after; panels get two legal parents -- building when present, yard when not, since not all substations have a building)
    cmds:
      - >-
        docker compose exec -T gitbash
        psql "{{.CONTAINER_DATABASE_URL}}"
        -f /workspace/seed/control_building_example.sql

  # seed-voltage-level removed: the VOLTAGE_LEVEL class was retired in the Phase 47
  # minimal-model correction (migration 0086). seed/voltage_level_example.sql is now a
  # documented no-op stub. Voltage is carried per equipment via BaseVoltage refs; BAY
  # is the one modeled container tier.

  seed-mv-switchgear-panels:
    desc: Load the indoor MV switchgear catalog (MV_EARTH_SWITCH + MV_SWITCHBOARD + MV_SWITCHGEAR_PANEL classes, yard->board->panel->device containment, BOARD_SCHEMATIC diagram type + placement allow-list; Phase 42 Slice 1) through the gitbash sidecar (requires seed-substation-yard + the MV plant seeds + seed-mv-busbar; compile CODE=MV_EARTH_SWITCH, CODE=MV_SWITCHBOARD and CODE=MV_SWITCHGEAR_PANEL after)
    cmds:
      - >-
        docker compose exec -T gitbash
        psql "{{.CONTAINER_DATABASE_URL}}"
        -f /workspace/seed/mv_switchgear_panel_example.sql

  seed-mv-switchgear-panel-templates:
    desc: Load the per-role panel device recipes (INCOMER/FEEDER/TRANSFORMER/BUS_SECTION/BUS_COUPLER -> standard device set) through the gitbash sidecar (Phase 42 Slice 2; requires migration 0072 + seed-mv-switchgear-panels + the MV device seeds; backs the composite POST /panels endpoint)
    cmds:
      - >-
        docker compose exec -T gitbash
        psql "{{.CONTAINER_DATABASE_URL}}"
        -f /workspace/seed/mv_switchgear_panel_templates.sql

  seed-circuit-ref:
    desc: Add circuit_ref to the conductor classes through the gitbash sidecar (Phase 35 Slice 1; double-circuit identity tag + demo label; recompile MV_CONDUCTOR + LV_CONDUCTOR after)
    cmds:
      - >-
        docker compose exec -T gitbash
        psql "{{.CONTAINER_DATABASE_URL}}"
        -f /workspace/seed/circuit_ref_example.sql

  seed-circuit-membership:
    desc: Stamp network (MV/LV) + add circuit_id to the electrical apparatus classes through the gitbash sidecar (Phase 37 Slice 2; circuit membership field + network-scoped picker; recompile each stamped class after)
    cmds:
      - >-
        docker compose exec -T gitbash
        psql "{{.CONTAINER_DATABASE_URL}}"
        -f /workspace/seed/circuit_membership_example.sql

  seed-operational-state:
    desc: Add the operational_state lifecycle field (PLANNED/IN_SERVICE/ISOLATED/RETIRED) to every physical asset class through the gitbash sidecar (Phase 38 Slice 1; recompile each stamped class, then run seed-operational-state-backfill)
    cmds:
      - >-
        docker compose exec -T gitbash
        psql "{{.CONTAINER_DATABASE_URL}}"
        -f /workspace/seed/operational_state_example.sql

  seed-operational-state-backfill:
    desc: Map existing rows onto operational_state (published->IN_SERVICE, draft->PLANNED) through the gitbash sidecar (Phase 38 Slice 1; run AFTER seed-operational-state and recompiling the stamped classes)
    cmds:
      - >-
        docker compose exec -T gitbash
        psql "{{.CONTAINER_DATABASE_URL}}"
        -f /workspace/seed/operational_state_backfill.sql

  seed-operational-state-transitions:
    desc: Enforce the operational_state lifecycle by authoring its legal transition edges (metadata.domain_transitions) through the gitbash sidecar (Phase 38 Slice 2; requires migration 0065 and seed-operational-state; metadata-only, no recompile)
    cmds:
      - >-
        docker compose exec -T gitbash
        psql "{{.CONTAINER_DATABASE_URL}}"
        -f /workspace/seed/operational_state_transitions.sql

  seed-operational-state-barriers:
    desc: Make operational_state ISOLATED/RETIRED a downstream/upstream trace barrier (trace_barrier_rules on edge/junction classes) through the gitbash sidecar (Phase 38 Slice 3; requires seed-operational-state + seed/trace_configurations_example.sql applied first; metadata-only, no recompile)
    cmds:
      - >-
        docker compose exec -T gitbash
        psql "{{.CONTAINER_DATABASE_URL}}"
        -f /workspace/seed/operational_state_barriers.sql

  seed-snapping:
    desc: Load the snapping_rules example metadata through the gitbash sidecar (requires seed-connectivity, and the switching-device/service-point seeds, first)
    cmds:
      - >-
        docker compose exec -T gitbash
        psql "{{.CONTAINER_DATABASE_URL}}"
        -f /workspace/seed/snapping_rules_example.sql

  seed-phase-model:
    desc: Load the PHASE domain + phase fields (Phase 9 Slice 0) through the gitbash sidecar (requires seed-connectivity first; re-compile MV_CONDUCTOR and DIST_XFMR after)
    cmds:
      - >-
        docker compose exec -T gitbash
        psql "{{.CONTAINER_DATABASE_URL}}"
        -f /workspace/seed/phase_model_example.sql

  seed-lv-conductors:
    desc: Load the LV_CONDUCTOR class (Phase 9 Slice 1) through the gitbash sidecar (requires seed-service-point + seed-phase-model first; compile CODE=LV_CONDUCTOR after)
    cmds:
      - >-
        docker compose exec -T gitbash
        psql "{{.CONTAINER_DATABASE_URL}}"
        -f /workspace/seed/lv_conductors_example.sql

  seed-service-point:
    desc: Load the SERVICE_POINT class + the DIST_XFMR T2 -> MV_CONDUCTOR network rule (seed/service_point_example.sql) through the gitbash sidecar (requires seed-connectivity first; compile CODE=SERVICE_POINT after)
    cmds:
      - >-
        docker compose exec -T gitbash
        psql "{{.CONTAINER_DATABASE_URL}}"
        -f /workspace/seed/service_point_example.sql

  seed-lv-devices:
    desc: Load the SERVICE_CUTOUT + LV_LINK_BOX classes (Phase 9 Slice 2) through the gitbash sidecar (requires seed-lv-conductors first; compile CODE=SERVICE_CUTOUT and CODE=LV_LINK_BOX after)
    cmds:
      - >-
        docker compose exec -T gitbash
        psql "{{.CONTAINER_DATABASE_URL}}"
        -f /workspace/seed/lv_devices_example.sql

  seed-lv-metering:
    desc: Load the METER + LV_BUSBAR + METER_CHAMBER classes (Phase 9 Slice 3) through the gitbash sidecar (requires seed-lv-devices first; compile CODE=METER, CODE=LV_BUSBAR and CODE=METER_CHAMBER after)
    cmds:
      - >-
        docker compose exec -T gitbash
        psql "{{.CONTAINER_DATABASE_URL}}"
        -f /workspace/seed/lv_metering_example.sql

  seed-lv-unmetered-ct:
    desc: Load STREET_LIGHT + add the ct_ratio field to METER (Phase 9 Slice 5) through the gitbash sidecar (requires seed-lv-metering + seed-lv-conductors first; compile CODE=STREET_LIGHT and re-compile CODE=METER after)
    cmds:
      - >-
        docker compose exec -T gitbash
        psql "{{.CONTAINER_DATABASE_URL}}"
        -f /workspace/seed/lv_unmetered_ct_example.sql

  seed-load-flow-fields:
    desc: Add the load-flow input fields (SERVICE_POINT.demand_kw/power_factor, DIST_XFMR.source_r_ohm/source_x_ohm/rated_kva; Phase 8) through the gitbash sidecar (requires seed-service-point + the DIST_XFMR seed first; re-compile CODE=SERVICE_POINT and CODE=DIST_XFMR after)
    cmds:
      - >-
        docker compose exec -T gitbash
        psql "{{.CONTAINER_DATABASE_URL}}"
        -f /workspace/seed/load_flow_fields.sql

  seed-transformer-fields:
    desc: Add the transformer voltage-transformation fields (DIST_XFMR.secondary_voltage/impedance_pct/x_r_ratio; Phase 28 Slice 1a) through the gitbash sidecar (requires the DIST_XFMR seed + seed-load-flow-fields first; re-compile CODE=DIST_XFMR after)
    cmds:
      - >-
        docker compose exec -T gitbash
        psql "{{.CONTAINER_DATABASE_URL}}"
        -f /workspace/seed/transformer_model_fields.sql

  seed-power-transformer:
    desc: Load the POWER_XFMR class (two-/three-winding substation power transformer; POWER_XFMR Slice 1) through the gitbash sidecar (requires seed-connectivity + migration 0070 applied first; compile CODE=POWER_XFMR after)
    cmds:
      - >-
        docker compose exec -T gitbash
        psql "{{.CONTAINER_DATABASE_URL}}"
        -f /workspace/seed/power_transformer_example.sql

  seed-earthing-transformer:
    desc: Load the EARTHING_XFMR class (substation earthing/grounding transformer; zero-sequence data record-only) through the gitbash sidecar (requires seed-connectivity first; compile CODE=EARTHING_XFMR after)
    cmds:
      - >-
        docker compose exec -T gitbash
        psql "{{.CONTAINER_DATABASE_URL}}"
        -f /workspace/seed/earthing_transformer_example.sql

  seed-mv-conductor-specs:
    desc: Add MV conductor impedance (MV_LINE_SPEC material-backed domain + material_specs + MV_CONDUCTOR.conductor_spec + MV ACLineSegment.r/.x CIM mapping; Phase 28 Slice 1b) through the gitbash sidecar (requires seed-connectivity + migration 0021 first; re-compile CODE=MV_CONDUCTOR after)
    cmds:
      - >-
        docker compose exec -T gitbash
        psql "{{.CONTAINER_DATABASE_URL}}"
        -f /workspace/seed/mv_conductor_specs.sql

  seed-zero-seq-fields:
    desc: Add the zero-sequence fields the ground-fault SLG calc reads (DIST_XFMR/POWER_XFMR.z0_pct + DIST_XFMR.source_r0_ohm/source_x0_ohm; ground-fault Slice 3) through the gitbash sidecar (requires the DIST_XFMR + POWER_XFMR seeds and migration 0071 first; re-compile CODE=DIST_XFMR and CODE=POWER_XFMR after)
    cmds:
      - >-
        docker compose exec -T gitbash
        psql "{{.CONTAINER_DATABASE_URL}}"
