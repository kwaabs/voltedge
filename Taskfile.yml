  # ------------------------------------------------------------- frontend --

  frontend-dev:
    desc: Run the React + Vite frontend dev server
    dir: web
    preconditions:
      - sh: powershell -NoProfile -Command "if (-not (Test-Path package.json)) { exit 1 }"
        msg: "web/package.json doesn't exist -- the frontend hasn't been scaffolded yet."
    cmds:
      - npm run dev

  # -------------------------------------------------------------- database --

  migrate:
    desc: Apply pending SQL migrations through the gitbash sidecar
    cmds:
      - >-
        docker compose exec -T
        -e DATABASE_URL="{{.CONTAINER_DATABASE_URL}}"
        gitbash bash /workspace/migrations/apply.sh

  migrate-status:
    desc: Show recorded migrations
    cmds:
      - >-
        docker compose exec -T gitbash
        psql "{{.CONTAINER_DATABASE_URL}}"
        -c "SELECT filename, status, applied_at FROM ops.migration_log ORDER BY id;"

  psql:
    desc: Open an interactive psql shell against dockerized postgres
    interactive: true
    cmds:
      - docker compose exec gitbash psql "{{.CONTAINER_DATABASE_URL}}"

  tile-scale-test:
    desc: "Bet 3 (scale) slice 1 -- measure tile render cost at NUM synthetic features (GiST index vs seq scan), via the gitbash sidecar. NUM (default 100000) + GEOMTYPE (point|line, default point -- line = conductor-like polylines, the heavier ST_AsMVTGeom case). Isolated scaletest schema, DROPPED at end (never touches real gis.* data/registry/map). Run at NUM=10000/100000/500000, GEOMTYPE=point then line. See scripts/scale/README.md."
    cmds:
      - >-
        docker compose exec -T
        gitbash psql "{{.CONTAINER_DATABASE_URL}}"
        -v num={{.NUM | default "100000"}}
        -v geomtype={{.GEOMTYPE | default "point"}}
        -f /workspace/scripts/scale/tile-scale-test.sql

  trace-scale-test:
    desc: "Bet 3 (scale) slice 2 -- measure the trace path on a synthetic radial feeder of NUM nodes (default 5000, above the engine's 2000-hop cap to demonstrate SILENT truncation). Shows the per-hop index-lookup cost + a set-based full-downstream traversal (reachable count, depth, exceeds-cap). Isolated scaletest schema, DROPPED at end. See scripts/scale/README.md."
    cmds:
      - >-
        docker compose exec -T
        gitbash psql "{{.CONTAINER_DATABASE_URL}}"
        -v num={{.NUM | default "5000"}}
        -f /workspace/scripts/scale/trace-scale-test.sql

  # ------------------------------------------------------------------ misc --

  clean:
    desc: Remove local build artifacts
    cmds:
      - powershell -NoProfile -Command "if (Test-Path '{{.API_DIR}}/bin') { Remove-Item -Recurse -Force '{{.API_DIR}}/bin' }"

  default:
    desc: Show available tasks
    cmds:
      - task --list
