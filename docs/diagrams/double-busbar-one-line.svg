  <text x="380" y="429" fill="#8695a8" font-size="11">circuit breaker (MV_BREAKER)</text>
  <text x="24" y="452" fill="#6b7789" font-size="11">Model: 2x MV_BUSBAR + coupler MV_BREAKER (rules C/D) + per-feeder MV_ISOLATOR x2 as bus selectors · all geometry_optional, diagram-only</text>
