<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
    <style>
      .lbl   { fill:#334155; }
      .muted { fill:#64748b; }
      .white { fill:#ffffff; font-weight:600; }
      .tree  { stroke:#94a3b8; stroke-width:1.5; fill:none; }
      .cim   { stroke:#0ea5e9; stroke-width:1.5; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="620" fill="#f8fafc"/>
  <text x="24" y="34" font-size="19" font-weight="700" class="lbl">Substation site model — minimal (Phase 47 correction)</text>

  <!-- ================= LEFT: MAP VIEW ================= -->
  <text x="24" y="70" font-size="14" font-weight="700" class="muted">ON THE MAP  (what you draw)</text>

  <!-- Substation boundary polygon (dashed fence, slate) -->
  <rect x="30" y="86" width="430" height="470" rx="6"
        fill="#f1f5f9" stroke="#475569" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="46" y="110" font-weight="700" class="lbl">SUBSTATION</text>
  <text x="46" y="128" class="muted" font-size="11">polygon · site boundary · primary/secondary_voltage</text>

  <!-- Control building polygon (optional, filled slate) -->
  <rect x="60" y="150" width="150" height="110" rx="4"
        fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
  <text x="72" y="172" font-weight="700" class="lbl" font-size="12">CONTROL_BUILDING</text>
  <text x="72" y="189" class="muted" font-size="10.5">optional polygon</text>
  <text x="72" y="204" class="muted" font-size="10.5">num_floors, construction…</text>
  <!-- panels shown as small cabinets inside building -->
  <rect x="72" y="216" width="26" height="32" rx="2" fill="#e2e8f0" stroke="#64748b"/>
  <rect x="104" y="216" width="26" height="32" rx="2" fill="#e2e8f0" stroke="#64748b"/>
  <rect x="136" y="216" width="26" height="32" rx="2" fill="#e2e8f0" stroke="#64748b"/>
  <text x="72" y="262" class="muted" font-size="9.5">SUBSTATION_PANELs (none-geom, listed)</text>

  <!-- MV busbar (a line) -->
  <line x1="250" y1="180" x2="430" y2="180" stroke="#1e293b" stroke-width="4"/>
  <text x="250" y="172" class="lbl" font-size="11" font-weight="600">MV_BUSBAR (line)</text>

  <!-- Feeder drops from busbar: breaker + transformer points -->
  <line x1="285" y1="180" x2="285" y2="300" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="360" y1="180" x2="360" y2="360" stroke="#1e293b" stroke-width="1.5"/>

  <!-- breaker (square) -->
  <rect x="275" y="300" width="20" height="20" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <text x="300" y="315" class="muted" font-size="10.5">MV_BREAKER (point)</text>
  <!-- CT/VT (small circles) -->
  <circle cx="285" cy="340" r="7" fill="#bae6fd" stroke="#0369a1"/>
  <text x="300" y="344" class="muted" font-size="10.5">MV_CT / MV_VT</text>

  <!-- transformer (two circles) -->
  <circle cx="360" cy="372" r="11" fill="#ddd6fe" stroke="#6d28d9" stroke-width="1.5"/>
  <circle cx="360" cy="388" r="11" fill="#ddd6fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="380" y="384" class="muted" font-size="10.5">POWER_XFMR (point)</text>

  <text x="46" y="540" class="muted" font-size="10.5" font-style="italic">BAY is logical (none-geom) — it groups the drops, it is not drawn.</text>

  <!-- ================= RIGHT: LOGICAL / CIM ================= -->
  <text x="520" y="70" font-size="14" font-weight="700" class="muted">CONTAINMENT TREE  (single-parent)  →  CIM export</text>

  <!-- helper: node boxes -->
  <!-- SUBSTATION -->
  <rect x="640" y="88" width="180" height="40" rx="6" fill="#475569"/>
  <text x="730" y="113" text-anchor="middle" class="white">SUBSTATION</text>

  <!-- children row 1 -->
  <!-- CONTROL_BUILDING (sibling, not a container -> dashed, off to side) -->
  <rect x="520" y="170" width="150" height="38" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="595" y="194" text-anchor="middle" class="lbl" font-size="12">CONTROL_BUILDING</text>

  <rect x="690" y="170" width="130" height="38" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="755" y="194" text-anchor="middle" class="lbl" font-size="12">SUBSTATION_PANEL</text>

  <rect x="840" y="170" width="120" height="38" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="900" y="194" text-anchor="middle" class="lbl" font-size="12">MV_BUSBAR</text>

  <!-- BAY -->
  <rect x="690" y="255" width="130" height="38" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="755" y="279" text-anchor="middle" class="lbl" font-size="12" font-weight="700">BAY</text>

  <!-- BAY children -->
  <rect x="560" y="335" width="120" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="620" y="357" text-anchor="middle" class="lbl" font-size="11">MV_BREAKER</text>
  <rect x="695" y="335" width="120" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="755" y="357" text-anchor="middle" class="lbl" font-size="11">MV_CT / MV_VT</text>
  <rect x="830" y="335" width="120" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="890" y="357" text-anchor="middle" class="lbl" font-size="11">POWER_XFMR</text>

  <!-- tree edges -->
  <path class="tree" d="M730,128 L730,150 L595,150 L595,170"/>
  <path class="tree" d="M730,150 L755,150 L755,170"/>
  <path class="tree" d="M730,150 L900,150 L900,170"/>
  <path class="tree" d="M755,208 L755,255"/>
  <path class="tree" d="M755,293 L755,315 L620,315 L620,335"/>
  <path class="tree" d="M755,315 L755,335"/>
  <path class="tree" d="M755,315 L890,315 L890,335"/>

  <text x="520" y="240" class="muted" font-size="10.5" font-style="italic">building = sibling asset,</text>
  <text x="520" y="254" class="muted" font-size="10.5" font-style="italic">not a containment parent</text>

  <!-- CIM export shape -->
  <text x="520" y="430" font-size="13" font-weight="700" class="lbl">CIM export shape (Substation → Bay → equipment)</text>
  <rect x="520" y="446" width="150" height="34" rx="6" fill="#e0f2fe" stroke="#0ea5e9"/>
  <text x="595" y="468" text-anchor="middle" class="lbl" font-size="12">cim:Substation</text>
  <rect x="720" y="446" width="120" height="34" rx="6" fill="#e0f2fe" stroke="#0ea5e9"/>
  <text x="780" y="468" text-anchor="middle" class="lbl" font-size="12">cim:Bay</text>
  <rect x="880" y="446" width="90" height="34" rx="6" fill="#e0f2fe" stroke="#0ea5e9"/>
  <text x="925" y="468" text-anchor="middle" class="lbl" font-size="11">equipment</text>
  <line class="cim" x1="670" y1="463" x2="718" y2="463"/>
  <line class="cim" x1="840" y1="463" x2="878" y2="463"/>

  <text x="520" y="512" class="muted" font-size="11">• No <tspan font-style="italic">cim:VoltageLevel</tspan> object — voltage rides on each equipment's <tspan font-style="italic">cim:BaseVoltage</tspan> ref.</text>
  <text x="520" y="532" class="muted" font-size="11">• BAY is the one real grouping tier; everything else is single-parent under SUBSTATION.</text>
  <text x="520" y="552" class="muted" font-size="11">• Trace / power-flow / fault ignore this tree entirely (they ride terminals + connectivity).</text>

  <!-- divider -->
  <line x1="490" y1="86" x2="490" y2="556" stroke="#e2e8f0" stroke-width="2"/>
</svg>
