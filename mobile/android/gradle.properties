# Build on JDK 21. The default launcher JVM here is laragon's JDK 17, but maplibre_gl 0.27
# compiles its Java module at source/target 21, so javac on 17 fails with "invalid source
# release: 21". AGP 8.13 + Flutter 3.44 both officially support running on JDK 21, and the
# app's own VERSION_17 source/target still emit 17-compatible bytecode, so nothing else
# changes. Forward slashes to avoid Java-properties backslash escaping.
org.gradle.java.home=C:/laragon/bin/java/jdk-21.0.10_windows_bin
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Build-speed flags. parallel = build independent modules concurrently; caching = reuse
# task outputs across builds; daemon = keep a warm JVM between runs. The heavy cost here is
# the first-time native compile (sqlite3_flutter_libs builds libsqlite3 via NDK); these make
# every subsequent incremental build far faster.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Built-in Kotlin OFF -- the stable AGP 8.x posture, and Flutter's own default (its
# migrator sets this false + newDsl=false so unmigrated plugins keep building). We are
# NOT on AGP 9, so there is no built-in Kotlin: the app + every plugin apply the classic
# org.jetbrains.kotlin.android plugin (maplibre_gl does so via its agpMajor<9 guard). Do
# NOT flip this to true without moving off AGP 8 AND confirming every native plugin has
# migrated (jni, sqlite3_flutter_libs, ... have not).
android.builtInKotlin=false
