org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Build-speed flags. parallel = build independent modules concurrently; caching = reuse
# task outputs across builds; daemon = keep a warm JVM between runs. The heavy cost here is
# the first-time native compile (sqlite3_flutter_libs builds libsqlite3 via NDK); these make
# every subsequent incremental build far faster.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Built-in Kotlin OFF -- the stable AGP 8.x posture, and Flutter's own default (its
# migrator sets this false + newDsl=false so unmigrated plugins keep building). We are
# NOT on AGP 9, so there is no built-in Kotlin: the app + every plugin apply the classic
# org.jetbrains.kotlin.android plugin (maplibre_gl does so via its agpMajor<9 guard). Do
# NOT flip this to true without moving off AGP 8 AND confirming every native plugin has
# migrated (jni, sqlite3_flutter_libs, ... have not).
android.builtInKotlin=false
