name: voltedge_field
description: "VoltEdge offline-first field tool (Phase 21)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management (design-locked).
  flutter_riverpod: ^2.5.1

  # Offline map render (Slice 2b, design-locked). Wraps MapLibre Native, so the
  # pack's vector tiles draw on the GPU (no Dart in the draw loop) and it exposes
  # the projection + query APIs snapping needs later: queryRenderedFeatures,
  # toLatLng(screenPoint), toScreenLocation(latLng). Tiles are served offline from
  # tiles.mbtiles by an in-app loopback HTTP server (see src/map/mbtiles_tile_server.dart),
  # not maplibre_gl's own download-to-cache path.
  #
  # Range (not a pre-1.0 caret): 0.20.x still references the removed Android v1
  # PluginRegistry.Registrar and won't compile on current Flutter; ^0.20.0 would
  # pin there (caret on 0.x = >=0.20.0 <0.21.0), so allow the modern releases.
  maplibre_gl: ">=0.21.0 <1.0.0"

  # HTTP client for the cmd/fieldsync pack API.
  http: ^1.2.2

  # On-device pack access: open the server-built SQLite pack directly and query
  # it with raw SQL (Slice 2a decision -- no Drift codegen for a read-only,
  # fixed-schema pack; revisit Drift in Slice 3 when the dirty-overlay + outbox
  # make reactive queries + migrations worth the build_runner step).
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.24 # bundles the native libsqlite3 on Android/iOS

  # Where downloaded packs live on the device.
  path_provider: ^2.1.4
  path: ^1.9.0

  # Rasterizes the pack's DB-authored symbology icons (Slice 8): metadata
  # .symbology_icons SVG rides in the pack (schema v5), and the map draws each
  # point as its real shape by registering a rasterized bitmap per (icon, color)
  # via MapLibre addImage. Used off-screen only (vg.loadPicture -> Picture ->
  # toImage in src/map/icon_atlas.dart), not as an SvgPicture widget. The five
  # built-in shapes stay Canvas-drawn (icon_atlas.dart) as the no-pack fallback.
  flutter_svg: ^2.0.10

  # Device GPS for feature placement (Slice 5b): the user can place a new feature
  # at their current position instead of tapping the map, and recenter the map on
  # themselves. Foreground-only; permission + service-enabled handled in
  # src/geo/location_service.dart. Manifest/Info.plist carry the usage strings.
  geolocator: ^13.0.1

  # Camera + gallery capture for image attachments (Phase 22 Slice 5). The field
  # tool is images-only: pick a photo from the camera or the gallery, copy it into
  # the pack dir, and queue it in the local_attachments outbox for upload on sync
  # (see src/attach/attachment_capture.dart). flutter.dev-maintained; camera/photo
  # usage strings live in AndroidManifest + Info.plist. Chosen over the heavier
  # `camera` plugin (no need for a live in-app preview / custom shutter here).
  image_picker: ^1.1.2

  # Camera QR / barcode scanning for asset tags (asset-tagging module S5). A field
  # worker scans the QR (encodes the deep-link `<origin>/t/<code>`) or the Code128
  # (encodes the raw code) printed on the plant, and the app resolves it back to
  # the GIS record -- offline against the pack's `asset_tags` index first, then the
  # online GET /tags?code= as a fallback (see src/ui/scan_tag_screen.dart). Wraps
  # MLKit (Android) / Vision (iOS); camera usage strings live in AndroidManifest +
  # Info.plist. Chosen over a raw `camera` + decode-in-Dart pipeline: it decodes on
  # the platform, handling both symbologies with one widget. (build verification owed.)
  mobile_scanner: ^5.2.3

  # The API bearer token is a credential, so it lives in the OS keystore (Android
  # Keystore-backed EncryptedSharedPreferences / iOS Keychain) rather than a plain
  # file; non-secret prefs stay in ve_settings.json (see settings_repository.dart).
  # This was briefly demoted to the JSON file while the toolchain sat on AGP 9 /
  # android.builtInKotlin=true, which conflicts with this plugin's unconditional
  # `apply 'kotlin-android'`. We are back on AGP 8 with builtInKotlin=false (see
  # android/gradle.properties), where that apply is correct, so the keystore is
  # reinstated. Version note: if `flutter pub get` can't resolve this against the
  # current SDK, bump the caret -- any version works on AGP 8 (build verification owed).
  flutter_secure_storage: ^9.2.2

  # Reads the installed app's version/build at runtime (package_info_plus) so the
  # launch-time update check can compare it against the published release manifest
  # (GET /app/latest), and opens the APK download URL in the device browser
  # (url_launcher) when a newer build is available -- the field-app half of the
  # self-distribution ("our own play store") flow. Both are flutter.dev-maintained.
  package_info_plus: ^8.0.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # App typeface: Noto Sans, BUNDLED (not fetched at runtime) so it renders with no
  # network -- the field tool is offline-first. Drop the static weights into
  # assets/fonts/ (from fonts.google.com/noto/specimen/Noto+Sans, the `static/`
  # folder of the download). weight numbers map to FontWeight.w400/.w500/.w600/.w700.
  fonts:
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
